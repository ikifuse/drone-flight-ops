<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>設計確認モック 自動検査</title>
<!--
  設計確認モックの自動検査（本番のアプリの検査ではありません）。
  - このページをブラウザーで開くと、モックを実際に操作して、動作と、利用者向けの画面の言葉を確かめます。
  - 利用者向けの画面（左側のスマホ画面）に、内部の用語・設計書の番号・状態ラベルなどが出ていないかを、
    操作のたびに自動で検査します。設計確認メモ・確認用の操作は検査の対象外です。
  - 外部通信・保存はありません。
-->
<link rel="stylesheet" href="../style.css">
<style>
 body{background:#fff}
 #panel{max-width:900px;margin:0 auto;padding:12px 16px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
 #summary{font-size:18px;font-weight:700;margin:6px 0}
 #summary.ok{color:#187a44}#summary.ng{color:#b3261e}
 #log li{margin:2px 0}#log li.ng{color:#b3261e;font-weight:700}
 #stage{height:760px;overflow:hidden;border-top:2px solid #d3dae6;background:#e9edf4;position:relative}
 /* 検査では、右側の設計確認欄を常に表示する（画面幅に関わらず、右側の操作を押せるように） */
 .memo{display:block !important;max-height:none !important;overflow:visible !important}
 #stage #root{flex-direction:row;align-items:flex-start;height:760px}
 #stage .phone{height:760px;flex:0 0 430px}
 #stage .mockbar{display:none}
</style>
</head>
<body>
<div id="panel">
  <h1 style="font-size:18px;margin:0">設計確認モック 自動検査</h1>
  <p style="margin:4px 0">このページを開くと、モックを自動で操作して確かめます（数十秒かかります）。下の「合格／不合格」を見てください。</p>
  <div id="summary">実行中…</div>
  <ol id="log"></ol>
  <pre id="result" hidden></pre>
</div>
<div id="stage"><div id="root"></div></div>
<script src="../js/core.js"></script>
<script src="../js/data.js"></script>
<script src="../js/map.js"></script>
<script src="../js/onboarding.js"></script>
<script src="../js/home.js"></script>
<script src="../js/register.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/newflight.js"></script>
<script src="../js/worklist.js"></script>
<script src="../js/operation.js"></script>
<script src="../js/history.js"></script>
<script src="../js/main.js"></script>
<script src="harness.js"></script>
<script src="t1_first_use.js"></script>
<script src="t2_settings_registration.js"></script>
<script src="t3_new_flight.js"></script>
<script src="t4_list_operation.js"></script>
<script src="t5_history_screens.js"></script>
<script src="t6_journey.js"></script>
<script>setTimeout(function(){runAll()},300)</script>
</body>
</html>
