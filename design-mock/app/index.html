          これまでの設計で決めた画面構成・導線を、実装の前に確かめるためのもの。
  - このフォルダーだけで動作します（外部通信・保存・DIPS/Google Drive接続・本番コードへの依存は一切ありません）。
  - データはすべてダミーです。新しいデータ構造・業務ルールの確定ではありません。
  - 正式Docs・既存アプリ本体（src / public）とは無関係に置いています。実装開始ではありません。
  - 画面の出典（どの設計書のどこか）と、設計上の状態（決定済み／案／仮／未設計）は、画面右のメモ欄（スマホ幅では「メモ」ボタン）に出ます。
-->
