<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>新規飛行 設計確認用モック（低忠実度・送信も保存もしません）</title>
<!--
  設計確認用モック（本番実装ではありません）
  - 目的: 「新規飛行」から「DIPSへ通報する直前」までを、オーナーが実際に触って画面の順序・分割・配置を判断するための、たたき台。
  - このファイルは単独で動作します（外部通信・保存・DIPS/Google Drive接続・本番コードへの依存は一切ありません）。
  - データはすべてダミーです。新しいデータ構造・業務ルールの確定ではありません。
  - 正式Docs・既存アプリ本体（src / public）とは無関係に置いています。
-->
<style>
:root{--bg:#e9edf4;--panel:#f6f8fc;--card:#fff;--ink:#1c2433;--sub:#5a6577;--line:#d3dae6;--acc:#1f5fbf;--accbg:#e7f0ff;--ok:#187a44;--okbg:#e3f5ea;--warn:#a55f00;--warnbg:#fff0d2;--ng:#b3261e;--ngbg:#fde8e6;--tmp:#7a5f00;--tmpbg:#fff5c2;--w:430px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#root{height:100%;display:flex;justify-content:center;align-items:flex-start;gap:16px}
.phone{position:relative;display:flex;flex-direction:column;width:100%;max-width:var(--w);height:100vh;height:100dvh;background:var(--panel);overflow:hidden}
.memo{display:none}
@media (min-width:900px){
  #root{padding:12px}
  .phone{height:calc(100vh - 24px);height:calc(100dvh - 24px);border:1px solid #9aa6bb;border-radius:26px;box-shadow:0 10px 32px rgba(20,30,50,.18)}
  .memo{display:block;flex:0 0 470px;max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
}
.hd{background:#fff;border-bottom:1px solid var(--line);padding:8px 10px 6px;flex:0 0 auto}
.hd1{display:flex;align-items:center;gap:6px}
.ttl{flex:1;min-width:0;font-weight:700}
.ttl small{display:block;font-weight:400;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.hd2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--sub);font-style:normal;line-height:1.6}
.chip.ok,.chip.auto{background:var(--okbg);color:var(--ok);border-color:#b9e3c9}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:#f0d29a}
.chip.ng{background:var(--ngbg);color:var(--ng);border-color:#f0b9b4}
.chip.tmp{background:var(--tmpbg);color:var(--tmp);border-color:#eadb85}
button.chip{cursor:pointer}
.prog{display:flex;gap:3px;margin-top:6px}
.prog i{flex:1;height:5px;border-radius:3px;background:#d7deea}
.prog i.done{background:#8fb1e6}.prog i.cur{background:var(--acc)}
.body{flex:1;overflow:auto;padding:12px 12px 20px;-webkit-overflow-scrolling:touch}
.ft{flex:0 0 auto;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.btn{flex:1;border-radius:12px;border:1px solid var(--line);background:#fff;padding:12px 10px;font-weight:700}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{flex:0 0 auto;padding:7px 12px;font-weight:600;font-size:13px}
h2{font-size:20px;margin:6px 0 4px}
h3{font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h3 small{font-weight:400;color:var(--sub);font-size:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.lead{color:var(--sub);font-size:13px;margin:0 0 10px}
.note{font-size:12px;color:var(--sub);margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px}
.card.sel{border-color:var(--acc);background:var(--accbg)}
.card.dead{opacity:.5}
.card span{font-size:13px;color:var(--sub)}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.mono{font-family:ui-monospace,Menlo,monospace}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 14px;min-height:96px;font-weight:700;font-size:16px}
.tile small{font-weight:400;color:var(--sub);font-size:12px}
.tile.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.tile.primary small{color:#dbe8ff}
.tile.wide{grid-column:1/-1}
.tgl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px;min-height:48px}
.tgl.sel{border-color:var(--acc);background:var(--accbg)}
.tgl.dim{opacity:.4}
.box{width:20px;height:20px;border:2px solid #9aa6bb;border-radius:5px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;background:#fff}
.tgl.sel .box{background:var(--acc);border-color:var(--acc);color:#fff}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px}
.pill.sel{border-color:var(--acc);background:var(--accbg);font-weight:700}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin:10px 0 6px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.row>label{min-width:5.5em;font-size:13px;color:var(--sub)}
.in{flex:1;min-width:0;border:1px solid #b9c3d4;border-radius:10px;padding:9px 10px;background:#fff}
.in:disabled{background:#eef1f6;color:#6a7486}
select.in{flex:0 0 auto}
textarea.in{width:100%;min-height:56px}
.tab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tool{border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
.tool.on{border-color:var(--acc);background:var(--accbg)}
.mapwrap{position:relative;border:1px solid #9aa6bb;border-radius:10px;overflow:hidden;background:#e8efe3;touch-action:manipulation}
.mapwrap svg{display:block;width:100%;height:auto}
.maptop{position:absolute;top:6px;left:6px;display:flex;gap:6px}
.maptop button{border:1px solid #9aa6bb;background:rgba(255,255,255,.92);border-radius:8px;padding:5px 9px;font-size:12px}
.maptop button.on{background:#ffe1e8;border-color:#e5486f}
.mapbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.kv td:first-child{width:38%;color:var(--sub)}
.msg{border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.msg.warn{background:var(--warnbg);color:#7a4a00}
.msg.ng{background:var(--ngbg);color:#8a1c16}
.msg.ok{background:var(--okbg);color:#125c33}
.msg.info{background:var(--accbg);color:#173f7c}
.rev{border-top:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:flex-start}
.rev:first-child{border-top:0}
.rev .k{flex:0 0 34%;font-size:13px;color:var(--sub)}
.rev .v{flex:1;min-width:0;font-size:14px;word-break:break-word}
.rev .e{flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
.ov{position:absolute;inset:0;background:rgba(20,30,50,.45);display:flex;align-items:flex-end;z-index:50}
.sheet{background:#fff;width:100%;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.sheet h3{font-size:17px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:8px 14px;border-radius:10px;z-index:99;max-width:90vw;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--sub)}
.cal button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 0}
.cal button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cal button:disabled{opacity:.35}
.memo h4{margin:14px 0 4px;font-size:14px}
.memo h4:first-child{margin-top:0}
.memo ul{margin:0;padding-left:1.2em;font-size:13px}
.memo table{border-collapse:collapse;width:100%;font-size:12px}
.memo td,.memo th{border:1px solid var(--line);padding:3px 5px;vertical-align:top;text-align:left}
.memo tr.cur td{background:var(--accbg)}
.tag{font-size:11px;background:#eef1f6;border-radius:6px;padding:0 5px;margin-right:3px;white-space:nowrap}
.fl{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.fl:first-child{border-top:0}
.fl b{flex:1;min-width:8em}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* ===================================================================
   新規飛行 設計確認用モック（低忠実度）
   - 送信・保存・外部接続なし。ダミーデータのみ。
   - DIPS22項目との対応は SCREENS[*].dips に持つ（画面上の番号表示はメモ欄のみ）
   =================================================================== */

/* ---------- ユーティリティ ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const slash=d=>d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
const daysTo=d=>Math.round((d-TODAY)/86400000);
const M_PER_PX=5; /* 架空地図: 1px = 5m */

/* ---------- DIPS公式 新規飛行計画22項目（PC/iPhoneで同じ順序。実地調査・実画面の観測） ---------- */
const DIPS_ITEMS=[[1,'飛行計画名称'],[2,'飛行許可番号'],[3,'参照飛行経路保存名称'],[4,'機体情報'],[5,'操縦者情報'],[6,'飛行目的'],[7,'飛行空域'],[8,'飛行方法'],[9,'保険に関する情報'],[10,'立入管理措置'],[11,'係留飛行'],[12,'補助者人数'],[13,'出発地'],[14,'目的地'],[15,'最大飛行時間'],[16,'所要時間'],[17,'開始日時'],[18,'終了日時'],[19,'定期・複数日指定'],[20,'飛行速度'],[21,'飛行高度'],[22,'連絡先']].map(([n,name])=>({n,name}));
const DNAME=n=>DIPS_ITEMS.find(x=>x.n===n).name;

/* DIPS Webに表示される選択肢（PC/iPhoneの観測どおりの表記） */
const BIZ=['空撮','報道取材','警備','農林水産業','測量','環境調査','設備メンテナンス','インフラ点検・保守','資材管理','輸送・宅配','自然観測','事故・災害対応','その他'];
const NON=['趣味','研究開発','その他'];
const AIR=['空港等周辺','地表・水面から150m以上の高さの空域','人・家屋の密集地域の上空','上記空域の飛行は行わない'];
const MET=['夜間飛行','目視外飛行','人・家屋等から30m未満','催し場所上空','危険物輸送','物件投下','上記方法の飛行は行わない'];
const TSU=['立入管理区画の設定','立入管理区画の設定(レベル3飛行)','立入管理区画の設定(レベル3.5飛行関連)','立入禁止区画の設定'];
const RADII=[10,20,50,100]; /* DIPSの「線」の半径候補（観測） */

/* ---------- 画面定義: DIPS項目の対応・目的・仮置き・相談したい点（メモ欄に表示） ---------- */
const SCREENS={
 home:{t:'ホーム',dips:[],
  goal:'アプリのホーム（4入口）。今回は「新規飛行」だけ動きます。',
  reuse:[],
  tmp:['4入口は既存設計のまま。他の3入口は今回のモック対象外'],
  ask:['ホームから直接「計画入力」に入るか、次の「始め方」を挟むか']},
 start:{t:'始め方',dips:[],
  goal:'新しく作る／過去の飛行を複製／現場プリセットから、のどこから始めるかを選ぶ。',
  reuse:['過去の飛行（複製）','現場プリセット'],
  tmp:['3つの入口のうち何を置くかは仮','「通報しない飛行（DIPS対象外）」の入口は既存設計の分岐を見せるための仮置き'],
  ask:['この画面は必要か（なくして「新しく作る」から始めてよいか）','複製したとき、どこまで自動で埋めるか（日時は毎回入れ直す想定）']},
 use:{t:'使うもの',sub:'機体・操縦者・許可',dips:[2,4,5],
  goal:'この飛行で使う機体・操縦者・許可承認を、登録済みから選ぶ。',
  reuse:['運用環境の登録実機','人員（操縦者）','許可承認の登録'],
  tmp:['カードに出す情報（期限・DIPS登録済みなど）は仮','許可と機体・空域・方法の照合ヒントは、サンプル判定（実際の判定ルールではない）'],
  ask:['3つを1画面にまとめてよいか、分けたいか','操縦者と連絡先（後の画面）を近づけたいか']},
 content:{t:'飛行の内容',sub:'目的・空域・方法・安全措置',dips:[6,7,8,10,11,12],
  goal:'飛行目的・空域・方法と、立入管理措置・係留・補助者人数を選ぶ。',
  reuse:['前回／プリセットの選択内容'],
  tmp:['選択肢の表記はDIPS Web（PC/iPhone観測）に合わせた','立入管理措置・係留・補助者人数をここに置くのは仮'],
  ask:['安全措置（立入管理・係留・補助者）をここに置くか、別画面にするか','「行わない」を選んだときの見せ方']},
 area:{t:'飛行範囲',sub:'地図・出発地・目的地',dips:[3,13,14],map:true,
  goal:'地図で飛行範囲（多角形・円・線＋幅）を作り、出発地と目的地を入れる。',
  reuse:['現場プリセット（範囲を呼び出す）'],
  tmp:['作図の操作（点をタップ→「完了」・1点戻す・編集）は、このモックの仮の操作。DIPS iPhone実機の作図操作は未確認なので、DIPSの再現ではない','地図は架空。実際の地図ライブラリは未選定','検索・規制空域の表示は位置を見せるだけの仮'],
  ask:['地図を独立した画面にするか、他とまとめるか','出発地・目的地の置き場所','DIPS保存済み経路（参照）の扱い']},
 time:{t:'日時・高度',sub:'日時・所要時間・速度・高度',dips:[15,16,17,18,19,20,21],
  goal:'開始日時・所要時間を入れ、終了日時は自動計算で確認。速度・高度を入れる。',
  reuse:['プリセット／前回の高度・所要時間'],
  tmp:['終了日時は自動計算（DIPSと同じ考え方）','最大飛行時間は意味がDIPS側で未確認のため位置も仮','複数日はカレンダーで日を選ぶ仮の作り'],
  ask:['最大飛行時間をここに置くか、詳細に畳むか','複数日指定の入口']},
 master:{t:'登録済み情報の確認',sub:'保険・連絡先',dips:[9,22],
  goal:'保険と連絡先を、登録済みの内容で自動入力して確認する（変更したいときだけ開く）。',
  reuse:['保険の登録','連絡先（自アカウント）'],
  tmp:['毎回変わらない情報を1画面にまとめる案。DIPSの順序（保険は途中、連絡先は最後）からは動かしている'],
  ask:['この画面は必要か（確認画面に統合してよいか）','保険・連絡先をどこまで自動にするか']},
 review:{t:'内容確認',dips:[1],
  goal:'入力した内容を確認し、計画名称を確認・修正する。足りない項目を見つける。',
  reuse:['計画名称の自動生成（仮ルール）'],
  tmp:['「画面ごと」と「DIPS項目順」の2通りの見せ方を切り替えられる','未入力・要確認の判定は仮'],
  ask:['確認画面に何を並べるか','問題の見せ方・直し方']},
 final:{t:'通報の直前',dips:[],
  goal:'DIPSへ通報する直前。通報の方法（APIで送信／DIPS Webへ転記）を選ぶところまで。',
  reuse:[],
  tmp:['この画面から先は今回のモック対象外（送信も保存もしない）','APIが使えるかどうかで見え方が変わる（右のメモ欄で切替）'],
  ask:['通報方法の選択をここで行うか、もっと前にするか','「下書きとして保存」の置き場所']}
};
const SCREEN_ORDER=['home','start','use','content','area','time','master','review','final'];
function coverage(){
  const cnt={};DIPS_ITEMS.forEach(x=>cnt[x.n]=0);
  Object.values(SCREENS).forEach(s=>s.dips.forEach(n=>{cnt[n]=(cnt[n]||0)+1}));
  return {missing:DIPS_ITEMS.filter(x=>cnt[x.n]===0).map(x=>x.n),dup:DIPS_ITEMS.filter(x=>cnt[x.n]>1).map(x=>x.n),ok:DIPS_ITEMS.filter(x=>cnt[x.n]===1).length};
}
const AUTOKEY={2:'permit',4:'aircraft',5:'pilots',6:'purpose',7:'air',8:'met',13:'from',14:'to',16:'dur',21:'alt',20:'speed',9:'ins',22:'contact'};

/* ---------- ダミーデータ（運用環境ごと）。新しいデータ構造の確定ではありません ---------- */
const GEO={
 river:{kind:'polygon',pts:[[80,90],[240,80],[265,165],[105,185]],r:0,width:10},
 park:{kind:'circle',pts:[[180,130]],r:60,width:10},
 line:{kind:'line',pts:[[60,200],[150,120],[300,150]],r:0,width:20}
};
const ENVS={
 personal:{name:'個人運用環境（サンプル）',
  aircraft:[
   {id:'a1',name:'デモ機A',model:'EVO Lite+',mark:'JU-SAMPLE-A01',expiry:addDays(TODAY,900),dips:true},
   {id:'a2',name:'デモ機B',model:'EVO Lite 6K Enterprise',mark:'JU-SAMPLE-B02',expiry:addDays(TODAY,20),dips:true},
   {id:'a3',name:'デモ機C（抹消済み）',model:'サンプルQ3',mark:'JU-SAMPLE-C03',expiry:addDays(TODAY,-30),dips:true,dead:true}],
  pilots:[
   {id:'p1',name:'サンプル操縦者A',role:'アプリ管理者・操縦者',pilot:true,dips:true,link:['a1','a2','a3']},
   {id:'p2',name:'サンプル操縦者B',role:'操縦者',pilot:true,dips:true,link:['a1']},
   {id:'p3',name:'サンプル補助者C',role:'補助者',pilot:false,dips:false,link:[]}],
  permits:[

/* ---------- 画面の並び（順序入れ替え・統合・省略を試せる） ---------- */
function pages(){
  const vis=S.flow.filter(f=>!f.skip);const mids=[];let i=0;
  while(i<vis.length){
    const ids=[vis[i].id];
    while(vis[i].merge&&i+1<vis.length){i++;ids.push(vis[i].id)}
    i++;mids.push({key:ids[0],ids});
  }
  return [{key:'home',ids:['home']},{key:'start',ids:['start']},...mids,{key:'review',ids:['review']},{key:'final',ids:['final']}];
}
const curPage=()=>{const ps=pages();return ps.find(p=>p.key===S.cur)||ps.find(p=>p.ids.includes(S.cur))||ps[0]};
const pageTitle=p=>p.ids.map(id=>SCREENS[id].t).join('＋');
function go(key,noScroll){
  const ps=pages();const p=ps.find(x=>x.key===key)||ps.find(x=>x.ids.includes(key));
  S.cur=p?p.key:'home';S.modal=null;render(!!noScroll);
  const b=$('#body');if(b&&!noScroll)b.scrollTop=0;
}
function step(d){const ps=pages();const i=ps.findIndex(p=>p.key===curPage().key);const j=Math.min(ps.length-1,Math.max(0,i+d));go(ps[j].key)}

function needTags(){const t=[];if(S.air.includes(AIR[2]))t.push('DID');if(S.met.includes(MET[0]))t.push('夜間');if(S.met.includes(MET[1]))t.push('目視外');if(S.met.includes(MET[2]))t.push('30m未満');return t}
function permitHints(){
  const E=ENV();const out=[];const m=E.permits.find(x=>x.id===S.permit);const need=needTags();
  if(S.permit&&S.permit!=='none'&&m){
    const unc=S.aircraft.filter(a=>!m.aircraft.includes(a));
    if(unc.length)out.push('この許可は選んだ機体（'+unc.map(acName).join('、')+'）を対象にしていません（サンプル判定）');
    const miss=need.filter(t=>!m.cover.includes(t));
    if(miss.length)out.push('この許可は「'+miss.join('・')+'」を含みません（サンプル判定）');
  }
  if(S.permit==='none'&&need.length)out.push('「'+need.join('・')+'」を選んでいますが、許可・承認が「なし」です（サンプル判定）');
  return out;
}
function startDT(){return new Date(S.startDate+'T'+pad(S.startH)+':'+pad(S.startM)+':00')}
function endDT(){return new Date(startDT().getTime()+(S.durH*60+S.durM)*60000)}
function fmtDT(d,ref){const s=slash(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());return ref&&ymd(d)!==ymd(ref)?s+'（翌日以降）':s}
function geomSummary(){
  const g=S.geom;if(!g.kind)return '未作成';
  if(g.kind==='circle'){if(!g.pts.length)return '円: 中心を置いてください';if(!g.r)return '円: 中心のみ（外周をタップ）';return '円: 半径 約'+Math.round(g.r*M_PER_PX/10)*10+'m'}
  if(g.kind==='polygon'){const n=g.pts.length;if(!g.done)return '多角形: '+n+'点（作図中）';let a=0;for(let i=0;i<n;i++){const p=g.pts[i],q=g.pts[(i+1)%n];a+=p[0]*q[1]-q[0]*p[1]}a=Math.abs(a)/2*M_PER_PX*M_PER_PX;return '多角形: '+n+'点・面積 約'+(a/10000).toFixed(1)+'ha'}
  const n=g.pts.length;if(!g.done)return '線＋幅: '+n+'点（作図中）';let L=0;for(let i=1;i<n;i++)L+=Math.hypot(g.pts[i][0]-g.pts[i-1][0],g.pts[i][1]-g.pts[i-1][1]);return '線＋幅: '+n+'点・長さ 約'+Math.round(L*M_PER_PX)+'m・半径'+g.width+'m';
}
function issues(){
  const E=ENV();const L=[];
  const add=(lv,text,scr)=>L.push({lv,text,scr});
  if(!S.aircraft.length)add('ng','機体が選ばれていません','use');
  S.aircraft.forEach(id=>{const a=E.aircraft.find(x=>x.id===id);if(a&&a.dead)add('ng',a.name+'は抹消・期限切れです','use');else if(a&&daysTo(a.expiry)<=30)add('warn',a.name+'の登録期限が近いです（'+daysTo(a.expiry)+'日）','use')});
  if(!S.pilots.length)add('ng','操縦者が選ばれていません','use');
  if(S.permit===null)add('warn','許可・承認が未選択です（不要なら「なし」を選ぶ）','use');
  permitHints().forEach(h=>add('warn',h,'use'));
  if(!S.biz.length&&!S.non.length)add('ng','飛行目的が選ばれていません','content');
  if((S.biz.includes('その他')&&!S.otherBiz.trim())||(S.non.includes('その他')&&!S.otherNon.trim()))add('warn','目的「その他」の内容が空です','content');
  if(!S.air.length)add('ng','飛行空域が未選択です（該当しない場合は「上記空域の飛行は行わない」）','content');
  if(!S.met.length)add('ng','飛行方法が未選択です（該当しない場合は「上記方法の飛行は行わない」）','content');
  if(!S.geom.done)add('ng','飛行範囲が完成していません','area');
  if(!S.from.trim())add('warn','出発地が空です（必須かどうかは仮）','area');
  if(!S.to.trim())add('warn','目的地が空です（必須かどうかは仮）','area');
  if(S.durH*60+S.durM<=0)add('ng','所要時間が0です','time');
  if(startDT()<new Date())add('warn','開始日時が過去です','time');
  if(!(S.speed>0))add('ng','飛行速度が正しくありません','time');
  if(!(S.alt>0))add('ng','飛行高度が正しくありません','time');
  if(S.ins.mode==='none'&&!S.ins.ability)add('warn','保険に加入していない場合、賠償能力の選択が必要です（仮）','master');
  if(S.contact.src==='pilot'&&!S.contact.pilotId)add('warn','連絡先の操縦者が選ばれていません','master');
  return L;
}
function insSummary(){

function contactSummary(){const c=S.contact;const srcs={self:'自アカウントの情報',application:'申請書記載の情報',pilot:'操縦者（'+(c.pilotId?plName(c.pilotId):'未選択')+'）'};return srcs[c.src]+' / '+c.name+' / '+c.phone+' / '+c.email}
function valueOf(n){

   case 7:return S.air.length?S.air.map(esc).join('<br>'):'<i class="chip ng">未選択</i>';
   case 8:return S.met.length?S.met.map(esc).join('<br>'):'<i class="chip ng">未選択</i>';
   case 9:return esc(insSummary());
   case 10:return S.tsu.map((v,i)=>v?esc(TSU[i]):null).filter(Boolean).join('<br>')||'なし';
   case 11:return S.tether==='yes'?'はい':'いいえ';
   case 12:return S.assist+'人';
   case 13:return S.from?esc(S.from):'<i class="chip warn">空</i>';
   case 14:return S.to?esc(S.to):'<i class="chip warn">空</i>';
   case 15:return S.maxH+'時間'+pad(S.maxM)+'分';
   case 16:return S.durH+'時間'+pad(S.durM)+'分';
   case 17:return fmtDT(startDT());

   case 20:return S.speed+' km/h（'+(S.speed/1.852).toFixed(1)+' kt）';
   case 21:return S.alt+' m';
   case 22:return esc(contactSummary());
  }
  return '';
}

function mapBase(){

  +'<g stroke="#fff" stroke-width="6" fill="none"><path d="M0 200H360M60 0V260M250 0V260M0 40H360"/></g>'
  +'<g fill="#d8d8d0"><rect x="70" y="205" width="40" height="30"/><rect x="120" y="210" width="50" height="25"/><rect x="262" y="50" width="45" height="40"/><rect x="262" y="205" width="60" height="35"/><rect x="8" y="50" width="40" height="35"/></g>'
  +'<text x="10" y="253" font-size="10" fill="#5b6b5b">サンプルの地図（架空）</text><text x="196" y="106" font-size="10" fill="#4b7ea3">サンプル川</text><text x="268" y="46" font-size="10" fill="#555">サンプル公園</text>'
  +'<line x1="292" y1="240" x2="312" y2="240" stroke="#333" stroke-width="2"/><text x="292" y="236" font-size="9" fill="#333">100m</text>';
}
function mapLayers(){
  const g=S.geom;let s='';
  if(S.layer)s+='<polygon points="30,30 210,20 230,150 40,160" fill="rgba(255,120,150,.28)" stroke="rgba(230,70,110,.6)" stroke-width="1.5"/><text x="40" y="48" font-size="10" fill="#c4234f">DID（サンプル）</text>';
  const col='#e07b00';
  if(g.kind==='polygon'&&g.pts.length){
    const p=g.pts.map(q=>q.join(',')).join(' ');
    if(g.done)s+='<polygon points="'+p+'" fill="rgba(255,150,0,.32)" stroke="'+col+'" stroke-width="2"/>';
    else s+='<polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-dasharray="5 3"/>';
  }
  if(g.kind==='line'&&g.pts.length){
    const p=g.pts.map(q=>q.join(',')).join(' ');const w=Math.max(2,2*g.width/M_PER_PX);
    if(g.pts.length>1)s+='<polyline points="'+p+'" fill="none" stroke="rgba(255,150,0,.35)" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"/>';
    s+='<polyline points="'+p+'" fill="none" stroke="'+col+'" stroke-width="2"'+(g.done?'':' stroke-dasharray="5 3"')+'/>';
  }
  if(g.kind==='circle'&&g.pts.length){
    const c=g.pts[0];if(g.r)s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+g.r+'" fill="rgba(255,150,0,.32)" stroke="'+col+'" stroke-width="2"/>';
    s+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="3" fill="'+col+'"/>';
  }
  g.pts.forEach((q,i)=>{if(g.kind!=='circle')s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3.5" fill="#fff" stroke="'+col+'" stroke-width="2"/>'});
  if(g.editing&&g.done){
    if(g.kind==='circle'){const c=g.pts[0];s+='<circle data-h="0" cx="'+c[0]+'" cy="'+c[1]+'" r="8" fill="#fff" stroke="#1f5fbf" stroke-width="3"/><circle data-h="r" cx="'+(c[0]+g.r)+'" cy="'+c[1]+'" r="8" fill="#1f5fbf" stroke="#fff" stroke-width="2"/>'}
    else g.pts.forEach((q,i)=>{s+='<circle data-h="'+i+'" cx="'+q[0]+'" cy="'+q[1]+'" r="8" fill="#fff" stroke="#1f5fbf" stroke-width="3"/>'});
  }
  return s;
}
function mapSvg(cls){return '<svg id="'+(cls?'mapmini':'map')+'" viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg">'+mapBase()+'<g id="'+(cls?'mapgm':'mapg')+'">'+mapLayers()+'</g></svg>'}
function geomHint(){
  const g=S.geom;
  if(!g.kind)return '① 上の図形（多角形／円／線＋幅）を選びます。② 地図をタップして点を置きます。';
  if(g.done)return '作図できました。「編集」で点をドラッグして直せます（仮の操作）。';
  if(g.kind==='polygon')return '地図をタップして頂点を置きます（3点以上で「完了」）。'+g.pts.length+'点';
  if(g.kind==='line')return '地図をタップして経路の点を置きます（2点以上で「完了」）。半径を選べます。'+g.pts.length+'点';
  return g.pts.length?'次に円の外周をタップします（半径が決まります）。':'円の中心をタップします。';
}
function vArea(){

   +(g.kind==='line'?'<label class="note">半径 <select class="in" data-bind="geom.width" data-num="1" data-rerender="1">'+RADII.map(r=>'<option value="'+r+'"'+(g.width===r?' selected':'')+'>'+r+'m</option>').join('')+'</select></label>':'');

   +'<div class="mapbar"><button class="btn sm" data-act="geom-done"'+(can?'':' disabled')+'>完了</button><button class="btn sm" data-act="geom-undo"'+((g.pts.length&&!g.done)||(g.kind==='circle'&&g.done)?'':' disabled')+'>1点戻す</button><button class="btn sm" data-act="geom-clear"'+(g.kind?'':' disabled')+'>やり直す</button><button class="btn sm" data-act="geom-edit"'+(g.done?'':' disabled')+'>'+(g.editing?'編集を終える':'編集')+'</button><button class="btn sm" data-act="geom-del"'+(g.done?'':' disabled')+'>削除</button></div>'
   +'<p class="note">'+geomHint()+'</p><div class="msg info">'+esc(geomSummary())+'</div>'
   +'<p class="note">'+tmpChip+' 作図の操作はこのモックの仮のものです。DIPS iPhone実機の作図操作は未確認のため、DIPSの操作の再現ではありません。範囲は「今回の実際の飛行経路」に合わせて絞る想定です。</p>'
   +'<div class="grp">現場プリセットから呼び出す</div><div class="pills">'+E.presets.map(p=>pill('use-preset','data-id="'+p.id+'"',p.name,false)).join('')+'</div></div>'
   +'<div class="sec"><h3>場所 <small>出発地・目的地</small></h3><div class="row"><label>出発地</label><input class="in" data-bind="from" value="'+esc(S.from)+'" placeholder="例: 事務所"> '+autoChip('from')+'</div><div class="row"><label>目的地</label><input class="in" data-bind="to" value="'+esc(S.to)+'" placeholder="例: 現場名"> '+autoChip('to')+'</div></div>'

   +'<h4>試せること</h4><ul><li>右上「全体」: 画面の順序入れ替え・次の画面と1画面にまとめる・省く</li><li>内容確認: 「画面ごと／DIPS項目順」の切替</li><li>ホームの環境ボタン: 運用環境を切り替える（選べる内容が変わる）</li></ul>'
   +'<h4>操作</h4><div class="row"><button class="btn sm" data-act="fill">サンプルで全部埋めて確認画面へ</button><button class="btn sm" data-act="reset">最初からやり直す</button></div>'
   +'<div class="row"><label style="min-width:auto">API</label><span class="seg"><button class="'+(S.apiOk?'on':'')+'" data-act="api" data-v="1">利用できる（仮）</button><button class="'+(!S.apiOk?'on':'')+'" data-act="api" data-v="0">利用できない（仮）</button></span></div>'

  const prog=ps.slice(2).map((p,i)=>'<i class="'+(i+2<idx?'done':i+2===idx?'cur':'')+'"></i>').join('');

   +'<header class="hd"><div class="hd1">'+(isHome?'':'<button class="ib" data-act="back">←</button>')+'<div class="ttl">'+(isHome?'設計確認用モック':'新規飛行')+'<small>'+(isHome?'低忠実度・送信も保存もしません':esc(pageTitle(pg)))+'</small></div>'+(isHome?'':'<button class="ib" data-act="flow">全体</button>')+'<button class="ib memo-btn" data-act="memo">メモ</button></div>'

   +(isHome||pg.key==='start'?'':'<div class="prog">'+prog+'</div>')+'</header>'
   +'<main class="body" id="body">'+body+'</main>'
   +'<footer class="ft">'+(pg.key==='final'?'<button class="btn" data-act="back">戻る</button>':(isHome?'<button class="btn primary" data-act="new">新規飛行をはじめる</button>':'<button class="btn" data-act="back">戻る</button><button class="btn primary" data-act="next">次へ：'+esc(pageTitle(next))+'</button>'))+'</footer>'
   +modalHtml()+'</div><aside class="memo" id="memo">'+memo+'</aside>';
}

  else if(m.type==='cal')inner=calHtml();

  else if(m.type==='final'){inner='<h3>'+esc(m.title)+'</h3><p>ここから先は今回のモックの対象外です。送信も保存もしていません。</p><ul>'+m.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="row"><button class="btn" data-act="close">閉じる</button></div>'}
  return '<div class="ov" data-act="ov"><div class="sheet" data-stop="1">'+inner+'</div></div>';

  return '<h3>全体の流れ（試してみる）</h3><p class="note">順序の入れ替え・次の画面とのまとめ・省略を試せます。省いた画面の項目は、自動入力や既定値のまま進みます（確認画面には必ず出ます）。</p>'
   +'<div class="fl"><b>始め方</b><span class="note">固定</span></div>'+rows+'<div class="fl"><b>内容確認 → 通報の直前</b><span class="note">固定</span></div>'
   +'<div class="row"><button class="btn" data-act="flow-reset">元の並びに戻す</button><button class="btn primary" data-act="close">閉じる</button></div>';

function calHtml(){
  const y=S.cal.y,m=S.cal.m;const first=new Date(y,m,1);const last=new Date(y,m+1,0).getDate();
  let cells='';['日','月','火','水','木','金','土'].forEach(d=>cells+='<b>'+d+'</b>');
  for(let i=0;i<first.getDay();i++)cells+='<span></span>';
  for(let d=1;d<=last;d++){const dt=new Date(y,m,d);const k=ymd(dt);const past=dt<TODAY;cells+='<button data-act="cal-day" data-d="'+k+'"'+(past?' disabled':'')+(S.multi.includes(k)?' class="on"':'')+'>'+d+'</button>'}

}

/* ---------- 描画 ---------- */
function applyWidth(){document.documentElement.style.setProperty('--w',{phone:'430px',tab:'768px',pc:'1100px'}[S.width]||'430px')}
function render(keep){
  const b=$('#body');const st=b&&keep!==false?b.scrollTop:0;
  const ae=document.activeElement;const aid=ae&&ae.id;
  $('#root').innerHTML=shell(curPage());
  applyWidth();
  const nb=$('#body');if(nb)nb.scrollTop=keep===false?0:st;
  if(aid){const e=document.getElementById(aid);if(e&&e.focus&&(aid==='searchbox'||aid==='rn'))e.focus()}
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function openStub(title,msg){S.modal={type:'stub',title,msg};render()}

/* ---------- 地図の操作 ---------- */
function svgPoint(svg,e){const r=svg.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*360),Math.round((e.clientY-r.top)/r.height*260)]}
function mapClick(x,y){
  const g=S.geom;
  if(g.editing)return;
  if(!g.kind){toast('先に図形の種類（多角形／円／線＋幅）を選んでください');return}
  if(g.done){toast('作図済みです。「やり直す」か「削除」で作り直せます');return}
  if(g.kind==='circle'){
    if(!g.pts.length){g.pts=[[x,y]]}
    else{g.r=Math.max(8,Math.round(Math.hypot(x-g.pts[0][0],y-g.pts[0][1])));g.done=true}
  }else g.pts.push([x,y]);
  render();
}
let DRAG=null;
function dragMove(e){
  if(!DRAG)return;const svg=$('#map');if(!svg)return;const [x,y]=svgPoint(svg,e);const g=S.geom;
  if(g.kind==='circle'){if(DRAG==='r')g.r=Math.max(8,Math.round(Math.hypot(x-g.pts[0][0],y-g.pts[0][1])));else g.pts[0]=[x,y]}
  else g.pts[Number(DRAG)]=[x,y];
  const gm=$('#mapg');if(gm)gm.innerHTML=mapLayers();
}
function dragEnd(){if(DRAG){DRAG=null;render()}}
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('[data-h]');if(h&&S.geom.editing){DRAG=h.dataset.h;e.preventDefault()}});

/* ---------- 操作（data-act） ---------- */
const ACTS={
  'new':()=>go('start'),
  'stub':t=>openStub(t.dataset.t||'お知らせ',t.dataset.m||'今回のモック対象外です'),
  'close':()=>{S.modal=null;const ps=pages();if(!ps.some(p=>p.key===S.cur))S.cur=ps[2].key;render()},
  'ov':(t,e)=>{if(e.target===t){ACTS.close()}},
  'back':()=>step(-1),
  'next':()=>{if(S.cur==='start'&&!S.start)S.start={mode:'new',label:'新しく作る'};step(1)},
  'flow':()=>{S.modal={type:'flow'};render()},
  'memo':()=>{S.modal={type:'memo'};render()},
  'env':()=>{S.modal={type:'env'};render()},
  'set-env':t=>{S=freshState(t.dataset.id,S);render(false)},
  'rename':()=>{S.modal={type:'rename'};render()},
  'start-new':()=>{S.start={mode:'new',label:'新しく作る'};go(pages()[2].key)},
  'start-past':t=>{applyPast(ENV().past.find(h=>h.id===t.dataset.id));go(pages()[2].key)},
  'start-preset':t=>{applyPreset(ENV().presets.find(p=>p.id===t.dataset.id));go(pages()[2].key)},
  'pick-ac':t=>{const a=ENV().aircraft.find(x=>x.id===t.dataset.id);if(a.dead){toast('抹消・期限切れの機体は選べません（仮）');return}const i=S.aircraft.indexOf(a.id);if(i>=0)S.aircraft.splice(i,1);else S.aircraft.push(a.id);delete S.auto.aircraft;render()},
  'pick-pl':t=>{const p=ENV().pilots.find(x=>x.id===t.dataset.id);if(!p.pilot){toast('操縦者ではない人は選べません（仮）');return}const i=S.pilots.indexOf(p.id);if(i>=0)S.pilots.splice(i,1);else S.pilots.push(p.id);delete S.auto.pilots;render()},
  'pick-pm':t=>{const id=t.dataset.id;if(id!=='none'){const m=ENV().permits.find(x=>x.id===id);if(daysTo(m.to)<0){toast('期限切れの許可は選べません（仮）');return}}S.permit=id;delete S.auto.permit;render()},
  'tog-purpose':t=>{const k=t.dataset.g,v=t.dataset.v;const a=S[k];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);delete S.auto.purpose;render()},
  'tog-air':t=>{S.air=togExcl(S.air,t.dataset.v,AIR[3]);delete S.auto.air;render()},
  'tog-met':t=>{S.met=togExcl(S.met,t.dataset.v,MET[6]);delete S.auto.met;render()},
  'tog-tsu':t=>{const i=Number(t.dataset.i);S.tsu[i]=!S.tsu[i];render()},
  'tether':t=>{S.tether=t.dataset.v;render()},
  'assist':t=>{S.assist=Math.max(0,S.assist+Number(t.dataset.d));render()},
  'tool':t=>{const k=t.dataset.k;if(S.geom.kind!==k){S.geom={kind:k,pts:[],r:0,width:S.geom.width||10,done:false,editing:false}}render()},
  'geom-done':()=>{const g=S.geom;if((g.kind==='polygon'&&g.pts.length>=3)||(g.kind==='line'&&g.pts.length>=2)){g.done=true;delete S.auto.area;render()}},
  'geom-undo':()=>{const g=S.geom;if(g.kind==='circle'&&g.done){g.done=false;g.r=0}else g.pts.pop();render()},
  'geom-clear':()=>{S.geom={kind:S.geom.kind,pts:[],r:0,width:S.geom.width||10,done:false,editing:false};render()},
  'geom-edit':()=>{S.geom.editing=!S.geom.editing;render()},
  'geom-del':()=>{S.modal={type:'del'};render()},
  'del-ok':()=>{S.geom={kind:null,pts:[],r:0,width:10,done:false,editing:false};S.modal=null;render()},
  'layer':()=>{S.layer=!S.layer;render()},
  'use-preset':t=>{applyPreset(ENV().presets.find(p=>p.id===t.dataset.id));toast('プリセットから範囲・高度・場所などを入れました');render()},
  'pick-place':t=>{S.to=t.dataset.v;S.search='';toast('目的地に入れました（地図の移動は仮）');render()},
  'cal':()=>{S.modal={type:'cal'};render()},
  'cal-day':t=>{const k=t.dataset.d;const i=S.multi.indexOf(k);if(i>=0)S.multi.splice(i,1);else S.multi.push(k);render()},
  'cal-nav':t=>{let m=S.cal.m+Number(t.dataset.d),y=S.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m};render()},
  'cal-clear':()=>{S.multi=[];render()},
  'ins-mode':t=>{S.ins.mode=t.dataset.v;render()},
  'ins-set':t=>{S.ins[t.dataset.k]=t.dataset.v;render()},
  'contact-src':t=>{const src=t.dataset.v;S.contact.src=src;const E=ENV();
    if(src==='self'){Object.assign(S.contact,{name:E.contact.name,country:E.contact.country,pref:E.contact.pref,addr:E.contact.addr,phone:E.contact.phone,email:E.contact.email})}
    else if(src==='application'){Object.assign(S.contact,{name:'サンプル法人（申請書記載）',country:'日本/Japan',pref:'サンプル県',addr:'サンプル市サンプル4-5-6',phone:'0600000000',email:'office@example.invalid'})}
    else{Object.assign(S.contact,{name:S.contact.pilotId?plName(S.contact.pilotId):'（操縦者を選択）',phone:'09011112222',email:'pilot@example.invalid'})}
    render()},
  'jump':t=>go(t.dataset.s),
  'rv':t=>{S.reviewView=t.dataset.v;render()},
  'final-api':()=>{if(!S.apiOk){toast('API経路は利用できない設定（仮）です');return}S.modal={type:'final',title:'アプリからDIPSへ送信（API）',list:['送信中の表示','DIPSの応答（正常受付／重複あり／通信失敗など）','正常受付後の画面（飛行前点検へ／後で飛行する）']};render()},
  'final-manual':()=>{S.modal={type:'final',title:'DIPS Webへ転記して通報（Manual）',list:['DIPS Webを別画面で開く','DIPSの入力順に、コピー／選択／照合しながら転記','通報後の確認（受付番号の入力、または一覧での照合）']};render()},
  'reset':()=>{S=freshState(S.env,S);render(false)},
  'fill':()=>{fillSample();go('review')},
  'api':t=>{S.apiOk=t.dataset.v==='1';render()},
  'width':t=>{S.width=t.dataset.v;render()},
  'mv':t=>{const i=Number(t.dataset.i),d=Number(t.dataset.d),j=i+d;if(j<0||j>=S.flow.length)return;const f=S.flow;[f[i],f[j]]=[f[j],f[i]];render()},
  'mg':t=>{S.flow[Number(t.dataset.i)].merge=t.checked;render()},
  'sk':t=>{S.flow[Number(t.dataset.i)].skip=t.checked;render()},
  'flow-reset':()=>{S.flow=['use','content','area','time','master'].map(id=>({id,skip:false,merge:false}));render()}
};
function togExcl(arr,val,none){const i=arr.indexOf(val);if(val===none)return i>=0?[]:[none];const a=arr.filter(x=>x!==none);return i>=0?a.filter(x=>x!==val):a.concat(val)}

document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('#map')){const svg=$('#map');if(svg){const [x,y]=svgPoint(svg,e);mapClick(x,y)}return}
  const t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.stop)return;
  if(t.tagName==='INPUT'&&t.type==='checkbox')return; /* チェックボックスは change で処理 */
  const fn=ACTS[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.tagName==='INPUT'&&t.type==='checkbox'&&t.dataset.act){const fn=ACTS[t.dataset.act];if(fn)fn(t,e);return}
  if(t.dataset&&t.dataset.bind){setBind(t);if(t.dataset.rerender)render()}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!(t.dataset&&t.dataset.bind))return;
  if(t.dataset.search){S.search=t.value;const r=$('#sr');if(r){r.innerHTML=S.search?FAKE_PLACES.filter(p=>p.indexOf(S.search)>=0).map(p=>'<button class="tgl" data-act="pick-place" data-v="'+esc(p)+'"><span>'+esc(p)+'</span></button>').join(''):''}return}
  if(!t.dataset.rerender&&t.tagName!=='SELECT')setBind(t);
});
function setBind(t){
  const path=t.dataset.bind.split('.');let o=S;for(let i=0;i<path.length-1;i++)o=o[path[i]];
  const k=path[path.length-1];let v=t.type==='checkbox'?t.checked:t.value;
  if(t.dataset.num)v=(v===''?'':Number(v));
  o[k]=v;
}

/* ---------- 起動 ---------- */
function init(){
  S=freshState('personal');
  const h=(location.hash||'').replace(/^#/,'');
  const q=Object.fromEntries(h.split('&').filter(Boolean).map(x=>x.split('=')));
  if(q.env&&ENVS[q.env])S=freshState(q.env);
  if(q.width)S.width=q.width;
  if(q.fill)fillSample();
  if(q.api==='0')S.apiOk=false;
  if(q.step)S.cur=q.step;
  if(q.merge){S.flow.forEach(f=>{if(q.merge.split(',').includes(f.id))f.merge=true})}
  render(false);
}
window.MOCK={state:()=>S,go,render,ACTS,pages,coverage,issues,fillSample,init,SCREENS,DIPS_ITEMS};
init();
</script>
